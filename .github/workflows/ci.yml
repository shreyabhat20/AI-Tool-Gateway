name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gateway_test
          POSTGRES_USER: gateway
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://gateway@localhost:5432/gateway_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Type-check
        run: mypy app
      - name: Test
        run: pytest -q

  compose-integration:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create disposable local configuration
        run: python -m app.core.setup
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Start services
        run: docker compose up --build -d
      - name: Wait for API readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8000/health/ready > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "API readiness did not succeed within 120 seconds" >&2
          exit 1
      - name: Run Alembic migrations
        run: docker compose exec -T api alembic upgrade head
      - name: Seed demo data
        run: docker compose exec -T api python -m app.db.seeds
      - name: Verify API readiness after seeding
        run: curl --fail-with-body --silent --show-error http://localhost:8000/health/ready
      - name: Print Compose logs on failure
        if: failure()
        run: docker compose logs --no-color || true
      - name: Shut down services
        if: always()
        run: docker compose down --volumes --remove-orphans

