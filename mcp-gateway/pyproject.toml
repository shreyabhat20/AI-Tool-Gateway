[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "mcp-gateway"
version = "0.2.0"
description = "Local MCP-inspired tool gateway and registry"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<7",
  "pydantic-settings>=2.8,<3",
  "PyJWT>=2.10,<3",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "prometheus-client>=0.21,<1",
  "opentelemetry-api>=1.31,<2",
  "opentelemetry-sdk>=1.31,<2",
  "opentelemetry-instrumentation-fastapi>=0.52b0,<1",
  "opentelemetry-instrumentation-httpx>=0.52b0,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "types-jsonschema>=4.23,<5",
  "fakeredis>=2.27,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]

